<!doctype html>
<!-- Fuente del icono de la app. Se renderiza a PNG 1024x1024 con: node scripts/render-icon.cjs -->
<html>
  <body style="margin:0;background:transparent">
    <svg id="s" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="bg" cx="50%" cy="38%" r="75%">
          <stop offset="0" stop-color="#4b5ce6" />
          <stop offset="0.55" stop-color="#1d2470" />
          <stop offset="1" stop-color="#0b0f24" />
        </radialGradient>
        <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff3a0" />
          <stop offset=".5" stop-color="#ffc21a" />
          <stop offset="1" stop-color="#c46d00" />
        </linearGradient>
        <linearGradient id="fl" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ff5a6e" />
          <stop offset="1" stop-color="#b00020" />
        </linearGradient>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#fff7c0" stop-opacity=".9" />
          <stop offset="1" stop-color="#ffb300" stop-opacity="0" />
        </radialGradient>
        <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".55" />
        </filter>
      </defs>
      <rect id="bgrect" width="1024" height="1024" fill="url(#bg)" />
      <g id="rays" opacity=".12"></g>
      <g filter="url(#sh)" transform="translate(500 540)">
        <circle r="390" fill="#111" />
        <g id="segs"></g>
        <circle r="34" fill="#0b8a45" />
        <circle r="15" fill="#c3162a" />
      </g>
      <circle cx="500" cy="540" r="120" fill="url(#glow)" />
      <g filter="url(#sh)" transform="translate(500 540) rotate(-40)">
        <rect x="-7" y="-20" width="14" height="70" rx="5" fill="#e6e8ee" />
        <rect x="-26" y="40" width="52" height="190" rx="22" fill="url(#gold)" stroke="#8a4f00" stroke-width="6" />
        <g stroke="#8a4f00" stroke-width="6" opacity=".7">
          <line x1="-24" y1="90" x2="24" y2="90" />
          <line x1="-24" y1="120" x2="24" y2="120" />
          <line x1="-24" y1="150" x2="24" y2="150" />
          <line x1="-24" y1="180" x2="24" y2="180" />
        </g>
        <rect x="-10" y="225" width="20" height="120" fill="#222" />
        <path d="M0 300 L-120 480 L0 430 Z" fill="url(#fl)" stroke="#5a0010" stroke-width="6" />
        <path d="M0 300 L120 480 L0 430 Z" fill="#e0123a" stroke="#5a0010" stroke-width="6" />
        <path d="M-60 330 L-40 360" stroke="#fff" stroke-width="10" opacity=".5" stroke-linecap="round" />
      </g>
    </svg>
    <script>
      const NS = 'http://www.w3.org/2000/svg';
      const add = (parent, tag, attrs) => {
        const el = document.createElementNS(NS, tag);
        for (const k in attrs) el.setAttribute(k, attrs[k]);
        parent.appendChild(el);
      };
      const segs = document.getElementById('segs');
      const arc = (r0, r1, a0, a1, c) => {
        const p = (r, a) => [Math.cos(a) * r, Math.sin(a) * r];
        const [x0, y0] = p(r1, a0), [x1, y1] = p(r1, a1), [x2, y2] = p(r0, a1), [x3, y3] = p(r0, a0);
        add(segs, 'path', { d: `M${x0} ${y0}A${r1} ${r1} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 0 0 ${x3} ${y3}Z`, fill: c });
      };
      for (let i = 0; i < 20; i++) {
        const c = ((-90 + i * 18) * Math.PI) / 180, a0 = c - (9 * Math.PI) / 180, a1 = c + (9 * Math.PI) / 180, dark = i % 2 == 0;
        arc(34, 190, a0, a1, dark ? '#1a1918' : '#efe3c4');
        arc(190, 214, a0, a1, dark ? '#d4142c' : '#0b9a4d');
        arc(214, 320, a0, a1, dark ? '#1a1918' : '#efe3c4');
        arc(320, 345, a0, a1, dark ? '#d4142c' : '#0b9a4d');
      }
      for (let i = 0; i < 20; i++) {
        const a = ((-90 + 9 + i * 18) * Math.PI) / 180;
        add(segs, 'line', { x1: Math.cos(a) * 34, y1: Math.sin(a) * 34, x2: Math.cos(a) * 345, y2: Math.sin(a) * 345, stroke: '#d8dce6', 'stroke-width': 3 });
      }
      for (const r of [34, 190, 214, 320, 345]) add(segs, 'circle', { r, fill: 'none', stroke: '#d8dce6', 'stroke-width': 3 });
      const rays = document.getElementById('rays');
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * Math.PI * 2;
        add(rays, 'path', { d: `M500 540 L${500 + Math.cos(a) * 900} ${540 + Math.sin(a) * 900} L${500 + Math.cos(a + 0.12) * 900} ${540 + Math.sin(a + 0.12) * 900}Z`, fill: '#fff' });
      }
      // ?fg=1 → solo primer plano (icono adaptativo de Android), fondo transparente
      if (location.search.includes('fg=1')) {
        document.getElementById('bgrect').remove();
        document.getElementById('rays').remove();
      }
    </script>
  </body>
</html>
